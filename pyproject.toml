[project]
name = "pycaret-inno"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Santiago Cuellar", email = "santiagocuellarandrade@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=6.0.0",
    "kagglehub>=1.0.2",
    "pycaret>=3.3.2",
    "seaborn>=0.13.2",
    "ucimlrepo>=0.0.7",
]

[project.scripts]
app = "clasificador_desertores.app:main"



[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pyinstaller>=6.22.3",
]
